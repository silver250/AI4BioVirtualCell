[project]
name = "cellmates-vcc"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy", "pandas", "scipy", "h5py", "anndata", "marimo>=0.25,<0.26",
  "cell-eval2==0.22.0", "scanpy", "pyarrow"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
